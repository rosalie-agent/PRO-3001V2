<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord PROOPE011 — Ambulance Chicoutimi SLN</title>
<style>
  :root {
    --bg: #f3f4f6;
    --card: #ffffff;
    --ink: #16212e;
    --navy: #16304f;
    --navy-dark: #0f2238;
    --accent: #2f5e8c;
    --sub: #677589;
    --border: #dde1e7;
    --border-strong: #c3c9d3;
    --ok-fg: #1f7a4d;     --ok-bar: #2f9e63;     --ok-bg: #eef6f1;
    --watch-fg: #92650a;  --watch-bar: #c08a1a;  --watch-bg: #faf2e2;
    --soon-fg: #9a4a14;   --soon-bar: #c56a27;   --soon-bg: #faeee2;
    --crit-fg: #a3272c;   --crit-bar: #c23b40;   --crit-bg: #f8e9ea;
    --none-fg: #677589;   --none-bar: #a5acb8;   --none-bg: #eef0f3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { font-family: inherit; }

  .topbar {
    background: var(--navy);
    color: #eef1f5;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 3px solid var(--accent);
  }
  .topbar-org { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #a9bdd3; margin-bottom: 2px; }
  .topbar h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: 0.01em; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 24px 70px; }

  /* ---------- écran de connexion ---------- */
  #loginScreen {
    max-width: 400px;
    margin: 72px auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 32px 30px;
    box-shadow: 0 1px 3px rgba(16,34,56,0.06);
  }
  #loginScreen .login-brand { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sub); margin-bottom: 6px; }
  #loginScreen h2 { margin: 0 0 18px; font-size: 19px; font-weight: 600; color: var(--navy); border-bottom: 1px solid var(--border); padding-bottom: 14px; }
  #loginScreen label { display: block; font-size: 12.5px; color: var(--sub); margin-bottom: 5px; font-weight: 600; letter-spacing: 0.01em; }
  #loginScreen input {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border-strong); border-radius: 4px;
    font-size: 14.5px; margin-bottom: 16px; font-family: inherit; color: var(--ink);
  }
  #loginScreen input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(47,94,140,0.15); }
  #loginScreen button {
    width: 100%; padding: 10px; border: none; border-radius: 4px; background: var(--navy);
    color: #fff; font-size: 14.5px; font-weight: 600; cursor: pointer; letter-spacing: 0.01em;
  }
  #loginScreen button:hover { background: var(--navy-dark); }
  #loginError { color: var(--crit-fg); font-size: 13px; margin-top: 12px; display: none; }

  /* ---------- grille des véhicules ---------- */
  .section-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--sub); font-weight: 600; margin: 0 0 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 14px;
  }
  .vcard {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(16,34,56,0.04);
  }
  .vcard-bar { height: 4px; background: var(--none-bar); }
  .vcard.ok .vcard-bar { background: var(--ok-bar); }
  .vcard.watch .vcard-bar { background: var(--watch-bar); }
  .vcard.soon .vcard-bar { background: var(--soon-bar); }
  .vcard.crit .vcard-bar { background: var(--crit-bar); }
  .vcard-body { padding: 14px 16px 16px; }
  .vcard-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2px; }
  .vcard-unit {
    font-size: 17px; font-weight: 700; color: var(--navy); cursor: pointer; letter-spacing: 0.01em;
  }
  .vcard-unit:hover { text-decoration: underline; color: var(--accent); }
  .vcard-sector { font-size: 12px; color: var(--sub); }
  .vcard-status {
    display: inline-flex; align-items: center; font-size: 12px; font-weight: 700;
    letter-spacing: 0.02em; text-transform: uppercase; padding: 3px 9px; border-radius: 3px; margin: 9px 0 8px;
  }
  .vcard-status.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .vcard-status.watch { background: var(--watch-bg); color: var(--watch-fg); }
  .vcard-status.soon { background: var(--soon-bg); color: var(--soon-fg); }
  .vcard-status.crit { background: var(--crit-bg); color: var(--crit-fg); }
  .vcard-status.none { background: var(--none-bg); color: var(--none-fg); }
  .vcard-msg { font-size: 13.5px; margin: 4px 0; line-height: 1.4; }
  .vcard-meta { font-size: 12px; color: var(--sub); margin-top: 10px; display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 8px; }
  .vcard-updated { font-size: 11px; color: var(--sub); margin-top: 6px; }
  .vcard.stale { opacity: 0.6; }
  .vcard-detail-link { margin-top: 8px; font-size: 12px; color: var(--accent); cursor: pointer; display: inline-block; }
  .vcard-detail-link:hover { text-decoration: underline; }
  .empty-state { text-align: center; color: var(--sub); padding: 70px 20px; font-size: 14px; border: 1px dashed var(--border-strong); border-radius: 6px; }

  /* ---------- panneau détail ---------- */
  #detailOverlay {
    position: fixed; inset: 0; background: rgba(16,34,56,0.35); z-index: 40;
    display: none;
  }
  #detailOverlay.open { display: block; }
  #detailPanel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw);
    background: var(--card); box-shadow: -2px 0 16px rgba(16,34,56,0.18);
    transform: translateX(100%); transition: transform 0.18s ease;
    overflow-y: auto; z-index: 50;
  }
  #detailPanel.open { transform: translateX(0); }
  #detailPanel .detail-head {
    background: var(--navy); color: #fff; padding: 18px 20px; position: sticky; top: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  #detailPanel .detail-head h3 { margin: 0; font-size: 17px; }
  #detailPanel .detail-head p { margin: 4px 0 0; font-size: 12px; color: #b9c6d6; }
  #detailPanel .close-btn { background: none; border: none; color: #cdd8e4; font-size: 20px; cursor: pointer; line-height: 1; }
  #detailPanel .detail-body { padding: 18px 20px; }
  #detailPanel h4 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--sub);
    margin: 22px 0 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px;
  }
  #detailPanel h4:first-of-type { margin-top: 0; }
  .hist-item { border: 1px solid var(--border); border-radius: 5px; padding: 10px 12px; margin-bottom: 9px; font-size: 13px; }
  .act-row { font-size: 12.5px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .act-row:last-child { border-bottom: none; }

  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--sub); margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  #identityBar { display: flex; align-items: center; gap: 14px; font-size: 12px; color: #b9c6d6; }
  #identityBar button { background: none; border: 1px solid #39597d; color: #dbe6f0; font-size: 12px; cursor: pointer; padding: 5px 11px; border-radius: 4px; }
  #identityBar button:hover { background: rgba(255,255,255,0.08); }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-brand">Ambulance Chicoutimi SLN</div>
  <h2>Tableau de bord PROOPE011</h2>
  <label for="userInput">Identifiant</label>
  <input type="text" id="userInput" autocomplete="username">
  <label for="pwInput">Mot de passe</label>
  <input type="password" id="pwInput" autocomplete="current-password">
  <button id="loginBtn" type="button">Se connecter</button>
  <div id="loginError">Identifiant ou mot de passe incorrect.</div>
</div>

<div id="dashboardScreen" style="display:none;">
  <div class="topbar">
    <div>
      <div class="topbar-org">Ambulance Chicoutimi SLN</div>
      <h1 id="topTitle">Tableau de bord PROOPE011</h1>
    </div>
    <div id="identityBar">
      <span id="identityLabel"></span>
      <button id="logoutBtn" type="button">Déconnexion</button>
    </div>
  </div>
  <div class="wrap">
    <p class="section-label">Véhicules en faction</p>
    <div id="grid" class="grid"></div>
    <div class="legend">
      <span><i style="background:var(--ok-bar)"></i>Sous les seuils</span>
      <span><i style="background:var(--watch-bar)"></i>À surveiller</span>
      <span><i style="background:var(--soon-bar)"></i>Admissible (optionnel)</span>
      <span><i style="background:var(--crit-bar)"></i>Obligatoire</span>
      <span><i style="background:var(--none-bar)"></i>Aucune donnée récente</span>
    </div>
  </div>
</div>

<div id="detailOverlay"></div>
<div id="detailPanel">
  <div class="detail-head">
    <div>
      <h3 id="detailUnit">—</h3>
      <p id="detailSub"></p>
    </div>
    <button class="close-btn" id="closeDetailBtn" type="button">✕</button>
  </div>
  <div class="detail-body" id="detailContent"></div>
</div>

<!-- SDK Firebase (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
(function () {
  "use strict";

  // =====================================================================
  // CONFIGURATION
  // =====================================================================

  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyDYnY22y-kIMt6MQ3g-3sNESzEE65AaufY",
    authDomain: "pro-3001-chicoutimi.firebaseapp.com",
    projectId: "pro-3001-chicoutimi",
    storageBucket: "pro-3001-chicoutimi.firebasestorage.app",
    messagingSenderId: "858027894732",
    appId: "1:858027894732:web:8ebba662ba9ded26811f69"
  };

  // Comptes d'accès. ATTENTION — voir l'avertissement de sécurité dans le guide :
  // ce n'est qu'une barrière simple côté client, pas une vraie protection contre
  // quelqu'un de déterminé qui aurait le lien. Ne pas y mettre de données plus
  // sensibles que le statut de travail des véhicules.
  // Pour changer un identifiant ou un mot de passe, modifiez simplement la ligne
  // correspondante ci-dessous.
  var CREDENTIALS = [
    { username: "direction", password: "Adminambuchic-sln", role: "direction", label: "Direction" },
    { username: "ccsc", password: "Ccscapitales.ambuchic-sln", role: "repartiteurs", label: "Répartiteurs (CCSC)" }
  ];

  // Combien de temps avant qu'une fiche véhicule soit considérée "ancienne"
  var STALE_AFTER_MIN = 45;

  // =====================================================================

  var session = null; // { role, label }
  var db = null;
  var vehicleDocs = {};

  function $(id) { return document.getElementById(id); }

  function initFirebase() {
    if (!FIREBASE_CONFIG.apiKey || typeof firebase === "undefined") {
      console.warn("Firebase non configuré.");
      return false;
    }
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      return true;
    } catch (e) {
      console.error("Erreur d'initialisation Firebase :", e);
      return false;
    }
  }

  // ---------- connexion ----------
  $("loginBtn").addEventListener("click", attemptLogin);
  $("pwInput").addEventListener("keydown", function (e) { if (e.key === "Enter") attemptLogin(); });
  $("userInput").addEventListener("keydown", function (e) { if (e.key === "Enter") attemptLogin(); });

  function attemptLogin() {
    var u = $("userInput").value.trim().toLowerCase();
    var pw = $("pwInput").value;
    var match = CREDENTIALS.filter(function (c) { return c.username.toLowerCase() === u && c.password === pw; })[0];
    if (match) {
      session = { role: match.role, label: match.label };
      sessionStorage.setItem("proope011_dash_session", JSON.stringify(session));
      enterDashboard();
    } else {
      $("loginError").style.display = "block";
    }
  }

  $("logoutBtn").addEventListener("click", function () {
    sessionStorage.removeItem("proope011_dash_session");
    location.reload();
  });

  function enterDashboard() {
    $("loginScreen").style.display = "none";
    $("dashboardScreen").style.display = "block";
    $("topTitle").textContent = "Suivi en direct — " + session.label;
    $("identityLabel").textContent = session.label;
    if (initFirebase()) {
      listenToVehicles();
    } else {
      $("grid").innerHTML = '<div class="empty-state">Synchronisation non configurée.</div>';
    }
  }

  function listenToVehicles() {
    db.collection("vehicules").onSnapshot(function (snap) {
      vehicleDocs = {};
      snap.forEach(function (doc) { vehicleDocs[doc.id] = doc.data(); });
      renderGrid();
    }, function (err) {
      console.error("Erreur de synchronisation :", err);
      $("grid").innerHTML = '<div class="empty-state">Impossible de récupérer les données en direct. Vérifiez la connexion ou les règles Firestore.</div>';
    });
  }

  function fmtHM(min) {
    if (min === null || min === undefined || isNaN(min)) return "—";
    var h = Math.floor(min / 60), m = Math.round(min % 60);
    return h + "h" + (m < 10 ? "0" : "") + m;
  }

  function timeAgo(ts) {
    if (!ts) return "jamais";
    var ms = (ts.toMillis ? ts.toMillis() : new Date(ts).getTime());
    var diffMin = Math.round((Date.now() - ms) / 60000);
    if (diffMin < 1) return "à l'instant";
    if (diffMin < 60) return diffMin + " min";
    return Math.floor(diffMin / 60) + "h" + String(diffMin % 60).padStart(2, "0");
  }

  function isStale(ts) {
    if (!ts) return true;
    var ms = (ts.toMillis ? ts.toMillis() : new Date(ts).getTime());
    return (Date.now() - ms) / 60000 > STALE_AFTER_MIN;
  }

  var STATE_LABEL = { ok: "Sous les seuils", watch: "À surveiller", soon: "Admissible", crit: "Obligatoire", none: "Aucune donnée" };

  function renderGrid() {
    var ids = Object.keys(vehicleDocs).sort();
    var grid = $("grid");
    if (!ids.length) {
      grid.innerHTML = '<div class="empty-state">Aucun véhicule n\'a encore transmis de données.<br>Les fiches apparaîtront ici dès qu\'un TAP commence à remplir le PRO-3001 sur son téléphone.</div>';
      return;
    }
    grid.innerHTML = "";
    ids.forEach(function (id) {
      var v = vehicleDocs[id];
      var result = v.result || {};
      var state = result.state || "none";
      var stale = isStale(v.lastUpdated);
      var card = document.createElement("div");
      card.className = "vcard " + state + (stale ? " stale" : "");
      card.innerHTML =
        '<div class="vcard-bar"></div>' +
        '<div class="vcard-body">' +
          '<div class="vcard-head"><div class="vcard-unit" data-unit="' + escapeHtml(id) + '" tabindex="0">' + escapeHtml(id) + '</div><div class="vcard-sector">' + escapeHtml(v.sector || "") + '</div></div>' +
          '<div class="vcard-status ' + state + '">' + STATE_LABEL[state] + (stale ? " · info ancienne" : "") + '</div>' +
          '<div class="vcard-msg">' + escapeHtml(result.msg || "—") + '</div>' +
          '<div class="vcard-meta"><span>Cumul : ' + fmtHM(result.totalContinu) + '</span><span>Repos en cours : ' + fmtHM(result.restSinceLast) + '</span></div>' +
          '<div class="vcard-updated">Mis à jour il y a ' + timeAgo(v.lastUpdated) +
            (session.role === "direction" && v.enteredBy ? ' · saisi par ' + escapeHtml(v.enteredBy.name) + ' (' + escapeHtml(v.enteredBy.matricule) + ')' : '') + '</div>' +
          '<div class="vcard-detail-link" data-unit="' + escapeHtml(id) + '">Voir les activités' + (session.role === "direction" ? " et l'historique" : "") + ' →</div>' +
        '</div>';
      grid.appendChild(card);
    });
    grid.querySelectorAll(".vcard-unit, .vcard-detail-link").forEach(function (el) {
      el.addEventListener("click", function () { openDetail(el.getAttribute("data-unit")); });
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- panneau détail ----------
  $("closeDetailBtn").addEventListener("click", closeDetail);
  $("detailOverlay").addEventListener("click", closeDetail);
  function closeDetail() {
    $("detailPanel").classList.remove("open");
    $("detailOverlay").classList.remove("open");
  }

  function openDetail(unitId) {
    var v = vehicleDocs[unitId] || {};
    var acts = v.activities || [];
    $("detailUnit").textContent = unitId;
    $("detailSub").textContent = (v.sector || "Secteur non précisé") + " · début de faction " +
      (v.factionStartDate || "—") + " " + (v.factionStart || "");

    var html = '<h4>Activités du quart en cours</h4>';
    if (!acts.length) {
      html += '<p style="font-size:13px;color:var(--sub);">Aucune activité consignée.</p>';
    } else {
      acts.forEach(function (a, i) {
        html += '<div class="act-row">#' + (i + 1) + ' — ' + escapeHtml(a.startDate) + ' ' + escapeHtml(a.start) +
          ' → ' + escapeHtml(a.activityEndDate || a.callEndDate || "") + ' ' + escapeHtml(a.activityEnd || a.callEnd || "") + '</div>';
      });
    }
    if (session.role === "direction") {
      html += '<h4>Historique des quarts archivés</h4>';
      html += '<div id="histList-' + escapeHtml(unitId) + '" style="font-size:13px;color:var(--sub);">Chargement…</div>';
    }
    $("detailContent").innerHTML = html;
    $("detailPanel").classList.add("open");
    $("detailOverlay").classList.add("open");
    if (session.role === "direction") loadHistory(unitId);
  }

  function loadHistory(unitId) {
    var target = $("histList-" + unitId);
    if (!db || !target) return;
    db.collection("vehicules").doc(unitId).collection("historique")
      .orderBy("savedAt", "desc").limit(20).get()
      .then(function (snap) {
        if (snap.empty) { target.innerHTML = "Aucun quart archivé pour ce véhicule."; return; }
        var html = "";
        snap.forEach(function (doc) {
          var h = doc.data();
          var res = h.result || {};
          html += '<div class="hist-item"><b>' + escapeHtml(h.factionStartDate || "") + ' ' + escapeHtml(h.factionStart || "") + '</b><br>' +
            escapeHtml(res.msg || "—") + ' — cumul ' + fmtHM(res.totalContinu) + '<br>' +
            '<span style="color:var(--sub);">Archivé le ' + escapeHtml((h.savedAt || "").slice(0, 16).replace("T", " à ")) +
            (h.enteredBy ? ' · saisi par ' + escapeHtml(h.enteredBy.name) + ' (' + escapeHtml(h.enteredBy.matricule) + ')' : '') + '</span></div>';
        });
        target.innerHTML = html;
      })
      .catch(function (e) {
        target.innerHTML = "Erreur de chargement de l'historique.";
        console.error(e);
      });
  }

  // ---------- reprise de session ----------
  var saved = null;
  try { saved = JSON.parse(sessionStorage.getItem("proope011_dash_session") || "null"); } catch (e) {}
  if (saved && saved.role) {
    session = saved;
    enterDashboard();
  }
})();
</script>
</body>
</html>
